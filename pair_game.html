<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon-pair-game.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pairgame</title>
    <link rel="stylesheet" href="assets/css/pair.css">
</head>

<body>

    <header>
        <a href="index.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            回首頁
        </a>
        <h1>Pairgame</h1>
        <div class="controls">
            <button onclick="startGame('easy')" class="mode-btn" id="btn-easy">簡單</button>
            <button onclick="startGame('medium')" class="mode-btn" id="btn-medium">中等</button>
            <button onclick="startGame('hard')" class="mode-btn" id="btn-hard">困難</button>
        </div>
        <div class="status-bar">
            <span id="moves">步數: 0</span>
            <span id="pairs">配對: 0</span>
        </div>
    </header>

    <div id="game-container">
    </div>

    <div id="victory-modal" class="modal">
        <h2>🎉 完成遊戲！</h2>
        <p id="final-score">總步數: 0</p>
        <button class="restart-btn" onclick="restartCurrentLevel()">再玩一次</button>
    </div>

    <script src="assets/js/stats.js"></script>
    <script src="assets/js/pair.js"></script>
    <script>
        if (typeof Stats !== 'undefined') Stats.recordGamePlay('pairs');
    </script>
</body>

</html>
