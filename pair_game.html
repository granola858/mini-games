<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pairgame</title>
    <style>
        :root {
            /* 粉紫色系設定 */
            --primary-color: #AB47BC;
            /* 按鈕文字/主要色 */
            --active-text: #4A148C;
            /* 選中時的文字色 */
            --card-back: #CE93D8;
            /* 卡背顏色 (素色) */
            --card-front: #FFFFFF;
            /* 卡面顏色 */
            --success-color: #8E24AA;
            /* 配對成功框線 */
            --grey-text: #9E9E9E;
            /* 灰色文字 */
            --bg-control: #F3F3F3;
            /* 按鈕控制區底色 */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #FFFFFF;
            /* 移除背景底色，改為白 */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 標題與控制區 */
        header {
            width: 100%;
            padding: 20px 15px 10px 15px;
            /* 增加一點上方留白 */
            text-align: center;
            background-color: #fff;
            /* 移除 header 陰影讓畫面更乾淨 */
        }

        h1 {
            /* 原本 1.2rem -> 加大 */
            font-size: 24px;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
            color: var(--active-text);
        }

        /* 修改後的按鈕容器 - 模擬 iOS Segmented Control 背景 */
        .controls {
            display: flex;
            justify-content: center;
            background-color: var(--bg-control);
            padding: 4px;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            max-width: 320px;
            /* 控制按鈕區最大寬度 */
        }

        /* 您提供的按鈕樣式 */
        .mode-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--grey-text);
            /* 未選中時為灰色 */
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: white;
            color: var(--active-text);
            /* 選中時為深紫色 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* 狀態列調整 */
        .status-bar {
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            /* 置中對齊 */
            gap: 25px;
            color: var(--grey-text);
            /* 文字改為灰色 */
        }

        /* 遊戲區域容器 */
        #game-container {
            width: 92%;
            /* 稍微縮小寬度比例 */
            max-width: 480px;
            /* 最大寬度縮小，讓卡片變小 */
            margin: 0 auto;
            display: grid;
            gap: 6px;
            /* 間距縮小 2px (原8px) */
            padding-bottom: 30px;
            perspective: 1000px;
        }

        /* 卡片樣式 */
        .card {
            background-color: transparent;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            /* 圓角隨卡片縮小稍微調整 */
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
        }

        /* 卡背 (未翻開) - 移除圖案，改為素色 */
        .front {
            background-color: var(--card-back);
            transform: rotateY(0deg);
        }

        /* 移除原本的 .front::after (圓圈裝飾) */

        /* 卡面 (圖案面) */
        .back {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            border: 1px solid #eee;
            /* 增加極淡邊框增加層次 */
        }

        .card.matched .back {
            border-color: var(--success-color);
            background-color: #F8F1FA;
        }

        /* SVG 圖形樣式 - 稍微縮小讓留白更多 */
        .shape-svg {
            width: 55%;
            height: 55%;
        }

        /* 勝利彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            /* 背景更白一點 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .modal h2 {
            color: var(--active-text);
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--grey-text);
            margin-bottom: 25px;
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(171, 71, 188, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 回首頁按鈕 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #888888;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            background-color: #f8f9fa;
            border: 1px solid #eef5ff;
            z-index: 10;
        }

        .back-btn:hover {
            color: var(--primary-color);
            background-color: #fcf4fc;
            transform: translateX(-3px);
        }

        @media (max-width: 768px) {
            .back-btn {
                position: static;
                margin-bottom: 15px;
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        回首頁
    </a>

    <header>
        <h1>Pairgame</h1>
        <div class="controls">
            <button onclick="startGame('easy')" class="mode-btn" id="btn-easy">簡單</button>
            <button onclick="startGame('medium')" class="mode-btn" id="btn-medium">中等</button>
            <button onclick="startGame('hard')" class="mode-btn" id="btn-hard">困難</button>
        </div>
        <div class="status-bar">
            <span id="moves">步數: 0</span>
            <span id="pairs">配對: 0</span>
        </div>
    </header>

    <div id="game-container">
    </div>

    <div id="victory-modal" class="modal">
        <h2>🎉 完成遊戲！</h2>
        <p id="final-score">總步數: 0</p>
        <button class="restart-btn" onclick="restartCurrentLevel()">再玩一次</button>
    </div>

    <script>
        // 遊戲設定
        const config = {
            easy: { rows: 5, cols: 4 },
            medium: { rows: 6, cols: 5 },
            hard: { rows: 7, cols: 6 }
        };

        // 圖形與顏色池
        const shapes = ['circle', 'rect', 'triangle', 'diamond', 'cross', 'star', 'hexagon'];
        const colors = ['#BA68C8', '#EF5350', '#42A5F5', '#66BB6A', '#FFA726', '#FF7043', '#8D6E63', '#78909C'];

        let currentLevel = 'easy';
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLocked = false;

        const gameContainer = document.getElementById('game-container');
        const moveDisplay = document.getElementById('moves');
        const pairDisplay = document.getElementById('pairs');
        const modal = document.getElementById('victory-modal');

        function generateCardContent(totalPairs) {
            let deck = [];
            let shapeIndex = 0;
            let colorIndex = 0;

            for (let i = 0; i < totalPairs; i++) {
                const shape = shapes[shapeIndex % shapes.length];
                const color = colors[colorIndex % colors.length];

                shapeIndex++;
                if (shapeIndex % shapes.length === 0) colorIndex++;

                const cardData = { shape, color, id: i };
                deck.push(cardData, cardData);
            }

            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function getSvgIcon(type, color) {
            let path = '';
            switch (type) {
                case 'circle': path = '<circle cx="50" cy="50" r="40" />'; break;
                case 'rect': path = '<rect x="15" y="15" width="70" height="70" rx="10" />'; break;
                case 'triangle': path = '<polygon points="50,15 90,85 10,85" />'; break;
                case 'diamond': path = '<polygon points="50,10 90,50 50,90 10,50" />'; break;
                case 'cross': path = '<path d="M20,20 L80,80 M80,20 L20,80" stroke-width="15" stroke-linecap="round" />'; break;
                case 'star': path = '<polygon points="50,10 61,35 90,35 66,55 75,85 50,65 25,85 34,55 10,35 39,35" />'; break;
                case 'hexagon': path = '<polygon points="50,10 85,30 85,70 50,90 15,70 15,30" />'; break;
            }
            const attr = type === 'cross' ? `stroke="${color}" fill="none"` : `fill="${color}"`;
            return `<svg viewBox="0 0 100 100" class="shape-svg" ${attr}>${path}</svg>`;
        }

        function startGame(level) {
            currentLevel = level;

            // 更新按鈕狀態
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${level}`).classList.add('active');

            // 重置數據
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            isLocked = false;
            moveDisplay.textContent = `步數: ${moves}`;
            pairDisplay.textContent = `配對: ${matchedPairs}`;
            modal.classList.remove('show');

            // 設定 Grid
            const rows = config[level].rows;
            const cols = config[level].cols;
            gameContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            // 生成卡片
            const totalCards = rows * cols;
            const deckData = generateCardContent(totalCards / 2);
            gameContainer.innerHTML = '';

            deckData.forEach((data, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = data.id;

                const front = document.createElement('div');
                front.classList.add('card-face', 'front');

                const back = document.createElement('div');
                back.classList.add('card-face', 'back');
                back.innerHTML = getSvgIcon(data.shape, data.color);

                card.appendChild(front);
                card.appendChild(back);

                card.addEventListener('click', () => flipCard(card));
                gameContainer.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocked) return;
            if (card.classList.contains('flipped')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                moveDisplay.textContent = `步數: ${moves}`;
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.id === card2.dataset.id) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards.forEach(card => card.classList.add('matched'));
            matchedPairs++;
            pairDisplay.textContent = `配對: ${matchedPairs}`;
            flippedCards = [];
            isLocked = false;

            const totalPairs = (config[currentLevel].rows * config[currentLevel].cols) / 2;
            if (matchedPairs === totalPairs) {
                setTimeout(() => {
                    document.getElementById('final-score').textContent = `總步數: ${moves}`;
                    modal.classList.add('show');
                }, 500);
            }
        }

        function unflipCards() {
            setTimeout(() => {
                flippedCards.forEach(card => card.classList.remove('flipped'));
                flippedCards = [];
                isLocked = false;
            }, 800);
        }

        function restartCurrentLevel() {
            startGame(currentLevel);
        }

        // 初始化
        startGame('easy');

    </script>
</body>

</html>
