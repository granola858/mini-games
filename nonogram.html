<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon-nonogram.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonogram</title>
  <link rel="stylesheet" href="assets/css/nonogram.css">
</head>

<body>

  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        回首頁
      </a>

      <div class="top-controls">
        <button id="dark-mode-toggle" class="theme-toggle-btn" type="button" role="switch" aria-checked="false"
          aria-label="切換為深色模式" title="切換為深色模式">
          <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"></path>
          </svg>
        </button>

        <div class="menu-wrap">
          <button id="menu-btn" class="menu-btn" type="button" aria-label="開啟設定選單" aria-expanded="false"
            aria-controls="menu-panel">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="17" x2="20" y2="17"></line>
            </svg>
          </button>

          <div id="menu-panel" class="menu-panel hidden">
            <div class="menu-section">
              <div class="menu-title">螢幕設定</div>
              <div class="menu-toggle-row">
                <label class="menu-label" for="wake-lock-checkbox">螢幕防休眠</label>
                <label class="toggle-switch">
                  <input id="wake-lock-checkbox" type="checkbox">
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <div id="wake-lock-note" class="menu-note">防止遊戲進行期間螢幕自動變暗或休眠熄屏。</div>
            </div>

            <div class="menu-section">
              <div class="menu-title">外觀設定</div>
              <div class="menu-note">調整方塊和標題顏色，方便比賽時區分自己的盤面。</div>
              <div class="palette-grid">
                <button class="palette-swatch active" type="button" data-color="#FFB7F1"
                  style="--swatch-color: #FFB7F1;" aria-label="粉色"></button>
                <button class="palette-swatch" type="button" data-color="#FF8A65" style="--swatch-color: #FF8A65;"
                  aria-label="橘色"></button>
                <button class="palette-swatch" type="button" data-color="#F28482" style="--swatch-color: #F28482;"
                  aria-label="珊瑚紅"></button>
                <button class="palette-swatch" type="button" data-color="#FFD166" style="--swatch-color: #FFD166;"
                  aria-label="金黃色"></button>
                <button class="palette-swatch" type="button" data-color="#6BCB77" style="--swatch-color: #6BCB77;"
                  aria-label="綠色"></button>
                <button class="palette-swatch" type="button" data-color="#00B8A9" style="--swatch-color: #00B8A9;"
                  aria-label="青綠色"></button>
                <button class="palette-swatch" type="button" data-color="#4D96FF" style="--swatch-color: #4D96FF;"
                  aria-label="藍色"></button>
                <button class="palette-swatch" type="button" data-color="#577590" style="--swatch-color: #577590;"
                  aria-label="灰藍色"></button>
                <button class="palette-swatch" type="button" data-color="#9B5DE5" style="--swatch-color: #9B5DE5;"
                  aria-label="紫色"></button>
                <button class="palette-swatch" type="button" data-color="#EF476F" style="--swatch-color: #EF476F;"
                  aria-label="莓果紅"></button>
                <button class="palette-swatch" type="button" data-color="#118AB2" style="--swatch-color: #118AB2;"
                  aria-label="湖水藍"></button>
                <button class="palette-swatch" type="button" data-color="#3A86FF" style="--swatch-color: #3A86FF;"
                  aria-label="亮藍色"></button>
              </div>
              <label class="menu-label" for="custom-color-input">自訂顏色</label>
              <input id="custom-color-input" class="custom-color-input" type="color" value="#ffb7f1">
            </div>

            <div class="menu-section">
              <div class="menu-title">Seed 同步</div>
              <label class="menu-label" for="current-seed-output">目前題目 Seed</label>
              <textarea id="current-seed-output" class="seed-display" rows="3" readonly></textarea>
              <div class="menu-btn-row">
                <button id="copy-seed-btn" class="secondary-btn" type="button">複製 Seed</button>
              </div>
              <label class="menu-label" for="seed-input">讀取 Seed</label>
              <input id="seed-input" class="seed-input" type="text" spellcheck="false" autocomplete="off"
                placeholder="例如 NGM-10-0123ABCD...">
              <button id="load-seed-btn" class="primary-btn menu-action-btn" type="button">載入 Seed</button>
              <div id="seed-feedback" class="menu-feedback"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h1 class="h1">Nonogram</h1>

    <div class="toggle-container" id="level-toggle">
      <button class="mode-btn active" data-size="8">8x8</button>
      <button class="mode-btn" data-size="10">10x10</button>
      <button class="mode-btn" data-size="12">12x12</button>
    </div>

    <div class="action-msg-container">
      <div class="action-toggle" id="action-toggle">
        <button class="action-btn active" data-action="fill">塗黑</button>
        <button class="action-btn" data-action="mark">標記 Ｏ</button>
      </div>
      <button id="board-lock-btn" class="board-lock-btn" type="button" aria-label="盤面鎖定 (防誤觸)" title="盤面鎖定 (防誤觸)">
        <svg class="lock-icon unlocked-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <svg class="lock-icon locked-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </button>
      <div id="top-msg" class="top-msg hidden"></div>
    </div>

    <div class="game-board-wrapper">
      <div id="board-container" class="board-container">
        <div id="board" class="game-board"></div>
      </div>
    </div>

    <div class="status-area">
      <div id="main-actions" class="btn-group">
        <button id="undo-btn" class="secondary-btn" type="button" aria-label="返回上一步">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14L4 9l5-5"></path>
            <path d="M4 9h10a5 5 0 1 1 0 10h-2"></path>
          </svg>
        </button>
        <button id="new-game-btn" class="secondary-btn" type="button" aria-label="新的一局">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
        <button id="clear-board-btn" class="secondary-btn" type="button" aria-label="清空盤面">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        </button>
        <button id="check-btn" class="primary-btn" type="button" aria-label="確認答案">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </button>
      </div>
      <div id="result-box" class="status-area hidden">
        <div id="result-btns" class="btn-group"></div>
      </div>
    </div>

    <div id="confirm-overlay" class="confirm-overlay hidden" aria-hidden="true">
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title"
        aria-describedby="confirm-message">
        <div id="confirm-title" class="confirm-title"></div>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel-btn" class="secondary-btn" type="button">取消</button>
          <button id="confirm-ok-btn" class="primary-btn" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/stats.js"></script>
  <script src="assets/js/nonogram.js"></script>
  <script>
    if (typeof Stats !== 'undefined') Stats.recordGamePlay('nonogram');
  </script>
</body>

</html>
