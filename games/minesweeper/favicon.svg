<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="mineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Radar sweep / grid lines -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
  <line x1="16" y1="2" x2="16" y2="30" stroke="#38bdf8" stroke-width="0.75" opacity="0.25"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#38bdf8" stroke-width="0.75" opacity="0.25"/>
  <!-- Mine core & spikes -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10.5" y1="10.5" x2="21.5" y2="21.5" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10.5" y1="21.5" x2="21.5" y2="10.5" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="5" fill="url(#mineGlow)"/>
  <circle cx="14" cy="14" r="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Tactical corner accents -->
  <path d="M4 8 V4 H8" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M28 8 V4 H24" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M4 24 V28 H8" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M28 24 V28 H24" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
