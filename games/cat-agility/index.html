<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#efd8c4" data-theme-color-light="#efd8c4" data-theme-color-dark="#17110d">
    <title>貓咪跳箱 - 波波小遊戲</title>
    <meta name="description" content="貓咪跳箱（Cat Agility）：點一下讓黑貓蹬跳，鑽過貓抓柱、抽屜櫃與垂吊盆栽之間的縫隙，每穿過 7～13 組會冒出罐頭或貓草：罐頭套上擋一次撞擊的護盾，貓草觸發撞穿 3 組家具、撞散還加分的拆家暴衝，道具有時貼著家具、有時飄在兩組之間，要冒險才吃得到。預設 16-bit 像素日系客廳畫風，也能切回經典向量畫風；Web Audio 即時合成音效，手機觸控與鍵盤都能玩。">

    <!-- 防止深色模式閃爍：必須 inline 且排在所有 stylesheet 之前。
       內容是 BoboTheme.ANTI_FLASH_SNIPPET 的逐字複製，唯一來源在 ../../assets/js/bobo-theme.js。 -->
    <script>
        (() => {
            try {
                const homePref = JSON.parse(localStorage.getItem('bobo-home-preferences-v2') || '{}');
                const theme = ['dark', 'light'].includes(homePref.theme)
                    ? homePref.theme
                    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (_) { }
        })();
    </script>

    <link rel="stylesheet" href="cat-agility.css">
</head>

<body>
    <main class="stage" id="stage">
        <h1 class="sr-only">貓咪跳箱</h1>
        <!-- 名稱保持簡短；完整操作說明放在 aria-describedby，報讀器不會把一整段說明當成圖片名稱 -->
        <canvas id="game-canvas" role="img" aria-label="貓咪跳箱遊戲畫面" aria-describedby="canvas-help"></canvas>
        <p class="sr-only" id="canvas-help">點擊畫面、按空白鍵、上方向鍵或 W 讓黑貓跳躍，鑽過客廳家具之間的縫隙；每穿過 7～13 組家具會出現罐頭或貓草，罐頭是擋一次撞擊的護盾，貓草是撞穿 3 組家具的拆家暴衝。</p>

        <a href="../../index.html" class="hud-btn back-btn" aria-label="返回首頁">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span>回首頁</span>
        </a>

        <!-- 畫面風格鍵：像素／經典二選一，文字顯示目前風格；說明寫在 aria-label，JS 會在 init 時依偏好同步 -->
        <button class="hud-btn style-btn" id="style-btn" type="button" aria-label="畫面風格：像素，點擊切換為經典"
            title="畫面風格：像素，點擊切換為經典">
            <span aria-hidden="true">像素</span>
        </button>

        <!-- 規則鍵：開啟說明時遊戲自動暫停 -->
        <button class="hud-btn rules-btn" id="rules-btn" type="button" aria-label="遊戲規則" aria-haspopup="dialog"
            title="遊戲規則">
            <span aria-hidden="true">?</span>
        </button>

        <!-- 音效鍵是開／關兩態，用 aria-pressed 表達狀態；JS 會在 init 時依偏好同步 -->
        <button class="hud-btn sound-btn" id="sound-btn" type="button" aria-label="音效開關" aria-pressed="true"
            title="音效開關">
            <span aria-hidden="true">🔊</span>
        </button>

        <p class="sr-only" id="game-status" role="status" aria-live="polite"></p>
    </main>

    <!-- 規則說明 -->
    <dialog class="rules-dialog" id="rules-dialog" aria-labelledby="rules-title">
        <h2 id="rules-title">怎麼玩</h2>
        <h3>目標</h3>
        <p>讓黑貓一路鑽過客廳家具之間的縫隙，穿過越多組分數越高；撞到家具或地板就結束。</p>
        <h3>操作</h3>
        <ul>
            <li>觸控／滑鼠：點畫面讓貓咪蹬跳。</li>
            <li>鍵盤：空白鍵、上方向鍵或 W 跳躍。</li>
        </ul>
        <h3>道具</h3>
        <ul>
            <li>罐頭：套上護盾，可以擋下一次撞擊。</li>
            <li>貓草：拆家暴衝，連續撞穿 3 組家具，撞散還加分。</li>
        </ul>
        <p>看規則時遊戲會暫停，關掉後點畫面或按空白鍵繼續。</p>
        <button class="rules-close" id="rules-close" type="button">知道了</button>
    </dialog>

    <script src="../../assets/js/bobo-theme.js"></script>
    <script src="../../assets/js/bobo-audio.js"></script>
    <script src="../../assets/js/stats.js"></script>
    <script src="cat-agility.js"></script>
    <script>
        if (typeof Stats !== 'undefined') Stats.recordGamePlay('cat-agility');
    </script>
</body>

</html>
