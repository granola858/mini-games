<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="themeColor" content="#fdfbff">
    <meta name="description" content="在每一色塊、每行、每列各放一隻貓咪的療癒邏輯遊戲。">
    <title>Meowdoku 貓咪數獨</title>
    <script>
        // 在樣式表之前就定好主題，避免深色使用者進頁面閃一下白畫面
        (() => {
            try {
                const prefs = JSON.parse(localStorage.getItem('bobo-home-preferences-v2') || '{}');
                const local = localStorage.getItem('meowdoku-dark-mode-v1');
                const preferred = ['dark', 'light'].includes(prefs.theme)
                    ? prefs.theme
                    : (local === null ? null : (local === 'true' ? 'dark' : 'light'));
                document.documentElement.dataset.theme = preferred
                    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (_) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="meowdoku.css">
</head>

<body>

    <div id="app">
        <div class="top-bar">
            <a href="../../index.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                回首頁
            </a>

            <div class="top-bar-actions">
                <button id="soundBtn" class="theme-toggle-btn" type="button" role="switch" aria-checked="true"
                    aria-label="關閉音效" title="關閉音效">
                    <svg class="theme-icon sound-on-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 5 6 9H2v6h4l5 4z"></path>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                        <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                    </svg>
                    <svg class="theme-icon sound-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 5 6 9H2v6h4l5 4z"></path>
                        <line x1="22" y1="9" x2="16" y2="15"></line>
                        <line x1="16" y1="9" x2="22" y2="15"></line>
                    </svg>
                </button>

                <button id="darkModeToggle" class="theme-toggle-btn" type="button" role="switch" aria-checked="false"
                    aria-label="切換為深色模式" title="切換為深色模式">
                    <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path>
                        <path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path>
                        <path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path>
                        <path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="header-row">
            <div class="h1">Meowdoku</div>
            <div class="lives" id="livesDisplay" role="status" aria-live="polite"></div>
        </div>

        <div class="toggle-container">
            <button class="mode-btn active" data-size="6">6x6</button>
            <button class="mode-btn" data-size="7">7x7</button>
            <button class="mode-btn" data-size="8">8x8</button>
        </div>

        <div class="board-container" id="board" role="grid" aria-label="貓咪數獨棋盤"></div>

        <div class="controls-row">
            <button id="resetBtn" class="action-btn" type="button" aria-label="重置盤面" title="重置盤面">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-3-6.7"></path>
                    <path d="M21 3v6h-6"></path>
                </svg>
            </button>
            <button id="clearBtn" class="action-btn" type="button" aria-label="清空盤面" title="清空盤面">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21">
                    </path>
                    <path d="M22 21H7"></path>
                    <path d="m5 11 9 9"></path>
                </svg>
            </button>
            <button id="helpBtn" class="action-btn" type="button" aria-label="遊戲說明" title="遊戲說明">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="message-toast" id="toast"></div>

    <div id="helpOverlay" class="modal-overlay hidden">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
            <h2 id="helpTitle" class="modal-title">玩法說明</h2>
            <div class="modal-body">
                🐾 單擊或按住拖曳：標記「確定沒有貓」的貓爪。<br>
                🐱 雙擊：放置貓咪，放置錯誤時扣1顆心。<br><br>
                <strong>規則：</strong>每一顏色、每行、每列只能有１隻貓，貓咪周圍８格(含斜角)不能有其他貓咪。放錯扣1顆心！所有的貓咪正確放置完畢，即獲得勝利。
            </div>
            <button id="helpCloseBtn" class="modal-close-btn" type="button">關閉</button>
        </div>
    </div>

    <div id="confirmOverlay" class="modal-overlay hidden">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"
            aria-describedby="confirmMessage">
            <h2 id="confirmTitle" class="modal-title">重置盤面</h2>
            <p id="confirmMessage" class="modal-body">確定要重置目前盤面嗎？進度將會消失。</p>
            <div class="modal-actions">
                <button id="confirmCancelBtn" class="modal-btn secondary" type="button">取消</button>
                <button id="confirmOkBtn" class="modal-btn primary" type="button">重置</button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/stats.js"></script>
    <script src="meowdoku.js"></script>
    <script>
        if (typeof Stats !== 'undefined') Stats.recordGamePlay('meowdoku');
    </script>
</body>

</html>
